<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Long-output mean TTFT by single-flight release point</title>
  <desc id="desc">Line chart comparing mean time to first token when identical followers are released at request completion or prefix publication for simultaneous 128-token-output bursts at concurrency two, four, and eight.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .title { font-size: 18px; font-weight: 600; }
    .subtitle { font-size: 12px; fill: #57606a; }
    .axis { font-size: 13px; fill: #57606a; }
    .tick { font-size: 12px; fill: #57606a; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .series { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  </style>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" class="title">Long-Output TTFT by Single-Flight Release Point</text>
  <text x="450" y="48" text-anchor="middle" class="subtitle">Simultaneous identical bursts with completion-only publication and 128-token output</text>

  <line x1="90" y1="330" x2="830" y2="330" class="grid"/>
  <line x1="90" y1="270" x2="830" y2="270" class="grid"/>
  <line x1="90" y1="210" x2="830" y2="210" class="grid"/>
  <line x1="90" y1="150" x2="830" y2="150" class="grid"/>
  <line x1="90" y1="90" x2="830" y2="90" class="grid"/>
  <text x="78" y="334" text-anchor="end" class="tick">0</text>
  <text x="78" y="274" text-anchor="end" class="tick">500</text>
  <text x="78" y="214" text-anchor="end" class="tick">1,000</text>
  <text x="78" y="154" text-anchor="end" class="tick">1,500</text>
  <text x="78" y="94" text-anchor="end" class="tick">2,000</text>

  <line x1="90" y1="330" x2="830" y2="330" stroke="#57606a"/>
  <line x1="90" y1="60" x2="90" y2="330" stroke="#57606a"/>
  <text x="150" y="352" text-anchor="middle" class="tick">2</text>
  <text x="460" y="352" text-anchor="middle" class="tick">4</text>
  <text x="770" y="352" text-anchor="middle" class="tick">8</text>
  <text x="460" y="380" text-anchor="middle" class="axis">Concurrent requests</text>
  <text x="24" y="195" text-anchor="middle" class="axis" transform="rotate(-90 24 195)">Mean TTFT (ms)</text>

  <polyline points="150,167 460,119 770,92" class="series" stroke="#d97706"/>
  <polyline points="150,260 460,256 770,252" class="series" stroke="#2563eb"/>
  <g fill="#d97706"><circle cx="150" cy="167" r="5"/><circle cx="460" cy="119" r="5"/><circle cx="770" cy="92" r="5"/></g>
  <g fill="#2563eb"><circle cx="150" cy="260" r="5"/><circle cx="460" cy="256" r="5"/><circle cx="770" cy="252" r="5"/></g>

  <line x1="251" y1="405" x2="275" y2="405" class="series" stroke="#d97706"/><circle cx="263" cy="405" r="4" fill="#d97706"/>
  <text x="283" y="409" class="tick">Release at request completion</text>
  <line x1="501" y1="405" x2="525" y2="405" class="series" stroke="#2563eb"/><circle cx="513" cy="405" r="4" fill="#2563eb"/>
  <text x="533" y="409" class="tick">Release at prefix publication</text>
</svg>
