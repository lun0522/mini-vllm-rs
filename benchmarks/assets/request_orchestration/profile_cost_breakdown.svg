<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Pending and incoming request costs under fallback and detailed profiles</title>
<desc id="desc">Fixed snapshots for cedar, delta, and larch in Load schedule A. Each CPU and GPU candidate has fallback and detailed bars split into pending work and new request. CPU remains preferred for cedar and GPU for delta and larch. The largest change is delta GPU pending cost increasing from 2.605 to 5.136 seconds.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}.title{font-size:19px;font-weight:600}.small{font-size:12px;fill:#57606a}.label{font-size:14px;font-weight:600}.value{font-size:12px}.grid{stroke:#e5e7eb;stroke-width:1}</style>
<rect width="1100" height="760" fill="white"/>
<text x="550" y="29" text-anchor="middle" class="title">How profiles change pending-work and new-request estimates</text>
