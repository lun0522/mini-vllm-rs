<text x="402.44" y="393" class="value">15.91–15.96 s</text>
<rect x="170" y="405" width="249.33999999999997" height="17" fill="#9333ea"/>
<path d="M414.72,413.5 H423.9599999999999 M414.72,409 V418 M423.9599999999999,409 V418" class="error" fill="none"/>
<text x="432.9599999999999" y="418" class="value">17.81 s</text>
<text x="150" y="502" text-anchor="end" class="group">Affinity B</text>
<rect x="170" y="454" width="266" height="17" fill="#2563eb"/>
<path d="M428.72,462.5 H443.28 M428.72,458 V467 M443.28,458 V467" class="error" fill="none"/>
<text x="452.28" y="467" class="value">19.00 s</text>
<rect x="170" y="479" width="266.14000000000004" height="17" fill="#f59e0b"/>
<path d="M426.2,487.5 H446.08000000000004 M426.2,483 V492 M446.08000000000004,483 V492" class="error" fill="none"/>
<text x="455.08000000000004" y="492" class="value">19.01 s</text>
<rect x="170" y="504" width="222.46" height="17" fill="#16a34a"/>
<rect x="392.46000000000004" y="504" width="2.519999999999996" height="17" fill="#16a34a" opacity=".45"/>
<text x="403.98" y="517" class="value">15.89–16.07 s</text>
<rect x="170" y="529" width="246.40000000000003" height="17" fill="#9333ea"/>
<path d="M413.18,537.5 H419.62 M413.18,533 V542 M419.62,533 V542" class="error" fill="none"/>
<text x="428.62" y="542" class="value">17.60 s</text>
<text x="520" y="609" text-anchor="middle" class="small">Wall time (seconds)</text>
<rect x="80" y="632" width="13" height="10" fill="#2563eb"/><text x="100" y="642" class="small">Round robin</text>
<rect x="270" y="632" width="13" height="10" fill="#f59e0b"/><text x="290" y="642" class="small">Least requests</text>
<rect x="470" y="632" width="13" height="10" fill="#16a34a"/><text x="490" y="642" class="small">Estimated-work variants</text>
<rect x="755" y="632" width="13" height="10" fill="#9333ea"/><text x="775" y="642" class="small">Most cached prefix</text>
<text x="500" y="666" text-anchor="middle" class="small">Estimated-work labels show the range of four configuration means, not standard deviation.</text>
</svg>

