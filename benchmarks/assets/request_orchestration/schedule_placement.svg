<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="610" viewBox="0 0 1450 610" role="img" aria-labelledby="title desc">
<title id="title">Request placement in schedules A and B for round robin and least requests</title>
<desc id="desc">Twelve requests in arrival order for each workload and schedule. In load A medium requests delta and hazel go to GPU; in load B both go to CPU. In affinity A unique long requests delta and larch go to CPU; in affinity B both go to GPU. All rows have six requests per backend.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}.title{font-size:20px;font-weight:600}.note{font-size:14px;fill:#57606a}.label{font-size:15px;font-weight:600}.cell{font-size:13px;fill:white}.name{font-weight:600}.position{font-size:12px;fill:#57606a}</style>
