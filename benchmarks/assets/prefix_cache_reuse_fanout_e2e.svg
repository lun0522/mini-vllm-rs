<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Warm fan-out maximum E2E latency by concurrency</title>
  <desc id="desc">Line chart comparing ordinary paged-cache and prefix-cached maximum group completion latency at concurrency one, two, four, and eight.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .title { font-size: 18px; font-weight: 600; }
    .axis { font-size: 13px; fill: #57606a; }
    .tick { font-size: 12px; fill: #57606a; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .series { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  </style>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" class="title">Warm Fan-Out Maximum E2E by Concurrency</text>

  <line x1="90" y1="330" x2="830" y2="330" class="grid"/>
  <line x1="90" y1="276" x2="830" y2="276" class="grid"/>
  <line x1="90" y1="222" x2="830" y2="222" class="grid"/>
  <line x1="90" y1="168" x2="830" y2="168" class="grid"/>
  <line x1="90" y1="114" x2="830" y2="114" class="grid"/>
  <line x1="90" y1="60" x2="830" y2="60" class="grid"/>
  <text x="78" y="334" text-anchor="end" class="tick">0</text>
  <text x="78" y="280" text-anchor="end" class="tick">5,000</text>
  <text x="78" y="226" text-anchor="end" class="tick">10,000</text>
  <text x="78" y="172" text-anchor="end" class="tick">15,000</text>
  <text x="78" y="118" text-anchor="end" class="tick">20,000</text>
  <text x="78" y="64" text-anchor="end" class="tick">25,000</text>

  <line x1="90" y1="330" x2="830" y2="330" stroke="#57606a"/>
  <line x1="90" y1="60" x2="90" y2="330" stroke="#57606a"/>
  <text x="120" y="352" text-anchor="middle" class="tick">1</text>
  <text x="350" y="352" text-anchor="middle" class="tick">2</text>
  <text x="580" y="352" text-anchor="middle" class="tick">4</text>
  <text x="810" y="352" text-anchor="middle" class="tick">8</text>
  <text x="460" y="380" text-anchor="middle" class="axis">Concurrent requests</text>
  <text x="24" y="195" text-anchor="middle" class="axis" transform="rotate(-90 24 195)">Maximum E2E (ms)</text>

  <polyline points="120,295 350,259 580,193 810,68" class="series" stroke="#d97706"/>
  <polyline points="120,309 350,289 580,252 810,185" class="series" stroke="#2563eb"/>
  <g fill="#d97706"><circle cx="120" cy="295" r="4"/><circle cx="350" cy="259" r="4"/><circle cx="580" cy="193" r="4"/><circle cx="810" cy="68" r="4"/></g>
  <g fill="#2563eb"><circle cx="120" cy="309" r="4"/><circle cx="350" cy="289" r="4"/><circle cx="580" cy="252" r="4"/><circle cx="810" cy="185" r="4"/></g>

  <line x1="303" y1="405" x2="327" y2="405" class="series" stroke="#d97706"/><circle cx="315" cy="405" r="4" fill="#d97706"/>
  <text x="335" y="409" class="tick">Baseline</text>
  <line x1="455" y1="405" x2="479" y2="405" class="series" stroke="#2563eb"/><circle cx="467" cy="405" r="4" fill="#2563eb"/>
  <text x="487" y="409" class="tick">Prefix cached</text>
</svg>
