<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title description">
  <title id="title">Temperature effect on lossless speculative decoding</title>
  <desc id="description">Draft acceptance falls from 34.6 percent at temperature 0.2 to 28.6 percent at 0.7, then rises to 32.4 percent at 1.0 and 34.9 percent at 1.6.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .title { font-size: 18px; font-weight: 600; }
    .axis-label { font-size: 13px; font-weight: 600; }
    .tick { font-size: 12px; fill: #57606a; }
    .value { font-size: 11px; font-weight: 600; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
  </style>

  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" class="title">Acceptance did not decline monotonically with temperature</text>

  <line x1="100" y1="70" x2="800" y2="70" class="grid"/>
  <line x1="100" y1="135" x2="800" y2="135" class="grid"/>
  <line x1="100" y1="200" x2="800" y2="200" class="grid"/>
  <line x1="100" y1="265" x2="800" y2="265" class="grid"/>
  <line x1="100" y1="330" x2="800" y2="330" class="grid"/>

  <text x="84" y="74" text-anchor="end" class="tick">40%</text>
  <text x="84" y="139" text-anchor="end" class="tick">35%</text>
  <text x="84" y="204" text-anchor="end" class="tick">30%</text>
  <text x="84" y="269" text-anchor="end" class="tick">25%</text>
  <text x="84" y="334" text-anchor="end" class="tick">20%</text>
  <text x="35" y="200" text-anchor="middle" transform="rotate(-90 35 200)" class="axis-label">Draft acceptance</text>

  <polyline points="100,140 333,218 567,169 800,136" fill="none" stroke="#0969da" stroke-width="3"/>
  <circle cx="100" cy="140" r="5" fill="#0969da"/>
  <circle cx="333" cy="218" r="5" fill="#0969da"/>
  <circle cx="567" cy="169" r="5" fill="#0969da"/>
  <circle cx="800" cy="136" r="5" fill="#0969da"/>
  <text x="100" y="128" text-anchor="middle" class="value">34.6%</text>
  <text x="333" y="238" text-anchor="middle" class="value">28.6%</text>
  <text x="567" y="157" text-anchor="middle" class="value">32.4%</text>
  <text x="800" y="124" text-anchor="middle" class="value">34.9%</text>

  <text x="100" y="355" text-anchor="middle" class="tick">0.2</text>
  <text x="333" y="355" text-anchor="middle" class="tick">0.7</text>
  <text x="567" y="355" text-anchor="middle" class="tick">1.0</text>
  <text x="800" y="355" text-anchor="middle" class="tick">1.6</text>
  <text x="450" y="380" text-anchor="middle" class="axis-label">Temperature</text>

</svg>
