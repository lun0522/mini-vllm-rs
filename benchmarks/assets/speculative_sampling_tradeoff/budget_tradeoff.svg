<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title description">
  <title id="title">Output per verification round and latency by total-variation budget</title>
  <desc id="description">Two aligned panels show that as the total-variation budget rises from zero to one, output per target verification increases from 2.053 to 4 tokens and median end-to-end latency falls from 38.076 to 24.349 seconds. Target-only latency is 21.006 seconds.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .title { font-size: 18px; font-weight: 600; }
    .panel-title { font-size: 14px; font-weight: 600; }
    .axis-label { font-size: 13px; font-weight: 600; }
    .tick { font-size: 12px; fill: #57606a; }
    .value { font-size: 11px; font-weight: 600; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
  </style>

  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" class="title">More output per verification reduces latency</text>

  <!-- Panel A: output tokens per target verification. -->
  <text x="100" y="55" class="panel-title">A. Output per verification round</text>
  <line x1="100" y1="70" x2="800" y2="70" class="grid"/>
  <line x1="100" y1="121" x2="800" y2="121" class="grid"/>
  <line x1="100" y1="173" x2="800" y2="173" class="grid"/>
  <line x1="100" y1="224" x2="800" y2="224" class="grid"/>
  <line x1="100" y1="275" x2="800" y2="275" class="grid"/>

  <text x="84" y="74" text-anchor="end" class="tick">4.0</text>
  <text x="84" y="125" text-anchor="end" class="tick">3.5</text>
  <text x="84" y="177" text-anchor="end" class="tick">3.0</text>
  <text x="84" y="228" text-anchor="end" class="tick">2.5</text>
  <text x="84" y="279" text-anchor="end" class="tick">2.0</text>
  <text x="35" y="173" text-anchor="middle" transform="rotate(-90 35 173)" class="axis-label">Output tokens</text>

  <polyline points="100,270 170,240 310,161 450,133 590,86 800,70" fill="none" stroke="#0969da" stroke-width="3"/>
  <g fill="#0969da">
    <circle cx="100" cy="270" r="5"/><circle cx="170" cy="240" r="5"/><circle cx="310" cy="161" r="5"/>
    <circle cx="450" cy="133" r="5"/><circle cx="590" cy="86" r="5"/><circle cx="800" cy="70" r="5"/>
  </g>

  <!-- Panel B: median end-to-end latency. -->
  <text x="100" y="325" class="panel-title">B. End-to-end latency</text>
  <line x1="100" y1="340" x2="800" y2="340" class="grid"/>
  <line x1="100" y1="391" x2="800" y2="391" class="grid"/>
  <line x1="100" y1="443" x2="800" y2="443" class="grid"/>
  <line x1="100" y1="494" x2="800" y2="494" class="grid"/>
  <line x1="100" y1="545" x2="800" y2="545" class="grid"/>

  <text x="84" y="344" text-anchor="end" class="tick">40</text>
  <text x="84" y="395" text-anchor="end" class="tick">35</text>
  <text x="84" y="447" text-anchor="end" class="tick">30</text>
  <text x="84" y="498" text-anchor="end" class="tick">25</text>
  <text x="84" y="549" text-anchor="end" class="tick">20</text>
  <text x="35" y="443" text-anchor="middle" transform="rotate(-90 35 443)" class="axis-label">Median E2E (s)</text>

  <line x1="100" y1="535" x2="800" y2="535" stroke="#57606a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="790" y="528" text-anchor="end" class="value" fill="#57606a">Target only: 21.006 s</text>

  <polyline points="100,360 170,375 310,455 450,476 590,495 800,500" fill="none" stroke="#d97706" stroke-width="3"/>
  <g fill="#d97706">
    <circle cx="100" cy="360" r="5"/><circle cx="170" cy="375" r="5"/><circle cx="310" cy="455" r="5"/>
    <circle cx="450" cy="476" r="5"/><circle cx="590" cy="495" r="5"/><circle cx="800" cy="500" r="5"/>
  </g>

  <text x="100" y="570" text-anchor="middle" class="tick">0</text>
  <text x="170" y="570" text-anchor="middle" class="tick">0.1</text>
  <text x="310" y="570" text-anchor="middle" class="tick">0.3</text>
  <text x="450" y="570" text-anchor="middle" class="tick">0.5</text>
  <text x="590" y="570" text-anchor="middle" class="tick">0.7</text>
  <text x="800" y="570" text-anchor="middle" class="tick">1.0</text>
  <text x="450" y="598" text-anchor="middle" class="axis-label">Total-variation budget</text>
</svg>
