<rect x="650" y="101" width="108.7" height="16" fill="#2563eb"/><text x="764.7" y="113" class="value">10.87</text>
<rect x="650" y="123" width="54.2" height="16" fill="#16a34a"/><path d="M703.8,131 H704.6 M703.8,126.5 V135.5 M704.6,126.5 V135.5" class="error" fill="none"/><text x="710.6" y="135" class="value">5.38–5.46</text>
