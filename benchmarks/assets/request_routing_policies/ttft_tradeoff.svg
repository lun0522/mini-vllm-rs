<rect x="650" y="345" width="56.7" height="16" fill="#16a34a"/><path d="M706.3,353 H707.1 M706.3,348.5 V357.5 M707.1,348.5 V357.5" class="error" fill="none"/><text x="713.1" y="357" class="value">5.63–5.71</text>

