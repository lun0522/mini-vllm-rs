<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">Median and p95 time to first token across all workload schedules</title>
<desc id="desc">Two horizontal bar panels compare Round robin with the range of four estimated-work configurations for Load A, Load B, Affinity A, and Affinity B. Estimated work greatly lowers p95 TTFT in three cases, while its effect on median TTFT varies by case.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}
.title{font-size:20px;font-weight:600}.subtitle{font-size:13px;fill:#57606a}.panel{font-size:16px;font-weight:600}.label{font-size:13px;font-weight:600}.value{font-size:11px}.axis{font-size:11px;fill:#57606a}.grid{stroke:#d0d7de;stroke-width:1}.error{stroke:#24292f;stroke-width:1.5}.inside{font-size:11px;fill:white}
</style>
<rect width="1100" height="500" fill="white"/>
<text x="550" y="29" text-anchor="middle" class="title">Estimated work improved worst-request TTFT more consistently than median TTFT</text>
<text x="550" y="51" text-anchor="middle" class="subtitle">Mean of 3 runs · lower is better · estimated-work whiskers show the range across 4 configurations</text>
<text x="300" y="82" text-anchor="middle" class="panel">Median TTFT</text>
<text x="825" y="82" text-anchor="middle" class="panel">p95 TTFT</text>

<line x1="100" x2="100" y1="94" y2="401" class="grid"/><line x1="180" x2="180" y1="94" y2="401" class="grid"/><line x1="260" x2="260" y1="94" y2="401" class="grid"/><line x1="340" x2="340" y1="94" y2="401" class="grid"/><line x1="420" x2="420" y1="94" y2="401" class="grid"/><line x1="500" x2="500" y1="94" y2="401" class="grid"/>
<text x="100" y="420" text-anchor="middle" class="axis">0</text><text x="180" y="420" text-anchor="middle" class="axis">1</text><text x="260" y="420" text-anchor="middle" class="axis">2</text><text x="340" y="420" text-anchor="middle" class="axis">3</text><text x="420" y="420" text-anchor="middle" class="axis">4</text><text x="500" y="420" text-anchor="middle" class="axis">5 s</text>
<line x1="650" x2="650" y1="94" y2="401" class="grid"/><line x1="750" x2="750" y1="94" y2="401" class="grid"/><line x1="850" x2="850" y1="94" y2="401" class="grid"/><line x1="950" x2="950" y1="94" y2="401" class="grid"/><line x1="1000" x2="1000" y1="94" y2="401" class="grid"/>
<text x="650" y="420" text-anchor="middle" class="axis">0</text><text x="750" y="420" text-anchor="middle" class="axis">10</text><text x="850" y="420" text-anchor="middle" class="axis">20</text><text x="950" y="420" text-anchor="middle" class="axis">30</text><text x="1000" y="420" text-anchor="middle" class="axis">35 s</text>

<text x="88" y="119" text-anchor="end" class="label">Load A</text>
<rect x="100" y="101" width="165.6" height="16" fill="#2563eb"/><text x="271.6" y="113" class="value">2.07</text>
<rect x="100" y="123" width="147.1" height="16" fill="#16a34a"/><path d="M246.6,131 H247.6 M246.6,126.5 V135.5 M247.6,126.5 V135.5" class="error" fill="none"/><text x="253.6" y="135" class="value">1.83–1.85</text>
<text x="88" y="193" text-anchor="end" class="label">Load B</text>
<rect x="100" y="175" width="92.3" height="16" fill="#2563eb"/><text x="198.3" y="187" class="value">1.15</text>
<rect x="100" y="197" width="170.8" height="16" fill="#16a34a"/><path d="M268,205 H273.6 M268,200.5 V209.5 M273.6,200.5 V209.5" class="error" fill="none"/><text x="279.6" y="209" class="value">2.10–2.17</text>
