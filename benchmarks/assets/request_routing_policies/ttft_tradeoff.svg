<rect x="650" y="197" width="54.2" height="16" fill="#16a34a"/><path d="M703.9,205 H704.4 M703.9,200.5 V209.5 M704.4,200.5 V209.5" class="error" fill="none"/><text x="710.4" y="209" class="value">5.39–5.44</text>
<text x="638" y="267" text-anchor="end" class="label">Affinity A</text>
<rect x="650" y="249" width="344.2" height="16" fill="#2563eb"/><text x="988" y="261" text-anchor="end" class="inside">34.42</text>
<rect x="650" y="271" width="55.6" height="16" fill="#16a34a"/><path d="M705.3,279 H705.8 M705.3,274.5 V283.5 M705.8,274.5 V283.5" class="error" fill="none"/><text x="711.8" y="283" class="value">5.53–5.58</text>
