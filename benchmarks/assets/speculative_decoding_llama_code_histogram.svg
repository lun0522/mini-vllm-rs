<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title description">
  <title id="title">Llama selected draft-token counts for code refactoring</title>
  <desc id="description">The acceptance-rate policy favored eight tokens, while the accepted-length policy used a broader distribution.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .title { font-size: 18px; font-weight: 600; }
    .axis { font-size: 13px; fill: #57606a; }
    .value { font-size: 11px; font-weight: 600; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
  </style>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" class="title">Llama code refactoring: selected draft-token counts</text>
  <line x1="105" y1="70" x2="825" y2="70" class="grid"/><line x1="105" y1="147" x2="825" y2="147" class="grid"/>
  <line x1="105" y1="223" x2="825" y2="223" class="grid"/><line x1="105" y1="300" x2="825" y2="300" class="grid"/>
  <text x="92" y="74" text-anchor="end" class="axis">60</text><text x="92" y="151" text-anchor="end" class="axis">40</text>
  <text x="92" y="227" text-anchor="end" class="axis">20</text><text x="92" y="304" text-anchor="end" class="axis">0</text>
  <text x="24" y="187" text-anchor="middle" class="axis" transform="rotate(-90 24 187)">Number of uses</text>

  <rect x="306" y="292" width="28" height="8" rx="2" fill="#2563eb"/><text x="320" y="287" text-anchor="middle" class="value">2</text>
  <rect x="396" y="285" width="28" height="15" rx="2" fill="#2563eb"/><text x="410" y="280" text-anchor="middle" class="value">4</text>
  <rect x="486" y="292" width="28" height="8" rx="2" fill="#2563eb"/><text x="500" y="287" text-anchor="middle" class="value">2</text>
  <rect x="576" y="292" width="28" height="8" rx="2" fill="#2563eb"/><text x="590" y="287" text-anchor="middle" class="value">2</text>
  <rect x="666" y="292" width="28" height="8" rx="2" fill="#2563eb"/><text x="680" y="287" text-anchor="middle" class="value">2</text>
  <rect x="756" y="74" width="28" height="226" rx="2" fill="#2563eb"/><text x="770" y="69" text-anchor="middle" class="value">59</text>

  <rect x="334" y="273" width="28" height="27" rx="2" fill="#16a34a"/><text x="348" y="268" text-anchor="middle" class="value">7</text>
  <rect x="424" y="258" width="28" height="42" rx="2" fill="#16a34a"/><text x="438" y="253" text-anchor="middle" class="value">11</text>
  <rect x="514" y="281" width="28" height="19" rx="2" fill="#16a34a"/><text x="528" y="276" text-anchor="middle" class="value">5</text>
  <rect x="604" y="281" width="28" height="19" rx="2" fill="#16a34a"/><text x="618" y="276" text-anchor="middle" class="value">5</text>
  <rect x="694" y="281" width="28" height="19" rx="2" fill="#16a34a"/><text x="708" y="276" text-anchor="middle" class="value">5</text>
  <rect x="784" y="124" width="28" height="176" rx="2" fill="#16a34a"/><text x="798" y="119" text-anchor="middle" class="value">46</text>

  <text x="153" y="322" text-anchor="middle" class="axis">1</text><text x="243" y="322" text-anchor="middle" class="axis">2</text>
  <text x="333" y="322" text-anchor="middle" class="axis">3</text><text x="423" y="322" text-anchor="middle" class="axis">4</text>
  <text x="513" y="322" text-anchor="middle" class="axis">5</text><text x="603" y="322" text-anchor="middle" class="axis">6</text>
  <text x="693" y="322" text-anchor="middle" class="axis">7</text><text x="783" y="322" text-anchor="middle" class="axis">8</text>
  <text x="468" y="345" text-anchor="middle" class="axis">Selected draft-token count</text>
  <rect x="300" y="370" width="14" height="10" rx="2" fill="#2563eb"/><text x="322" y="379" class="axis">Acceptance rate</text>
  <rect x="480" y="370" width="14" height="10" rx="2" fill="#16a34a"/><text x="502" y="379" class="axis">Accepted length</text>
</svg>
