<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title description">
  <title id="title">Llama decode throughput by speculative policy</title>
  <desc id="description">Both dynamic policies outperform fixed-4. They exceed target-only throughput for code refactoring but not creative writing.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .title { font-size: 18px; font-weight: 600; }
    .label { font-size: 14px; }
    .tick { font-size: 12px; fill: #57606a; }
    .value { font-size: 12px; font-weight: 600; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
  </style>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" class="title">Llama decode throughput by policy</text>

  <!-- Plot: x=190..810 maps 0..22 tok/s. -->
  <line x1="190" y1="55" x2="190" y2="407" class="grid"/>
  <line x1="331" y1="55" x2="331" y2="407" class="grid"/>
  <line x1="472" y1="55" x2="472" y2="407" class="grid"/>
  <line x1="613" y1="55" x2="613" y2="407" class="grid"/>
  <line x1="754" y1="55" x2="754" y2="407" class="grid"/>

  <text x="175" y="135" text-anchor="end" class="label">Code refactoring</text>
  <rect x="190" y="67" width="461" height="22" rx="3" fill="#57606a"/><text x="659" y="83" class="value">16.36</text>
  <rect x="190" y="95" width="377" height="22" rx="3" fill="#d97706"/><text x="575" y="111" class="value">13.39</text>
  <rect x="190" y="123" width="550" height="22" rx="3" fill="#2563eb"/><text x="748" y="139" class="value">19.50</text>
  <rect x="190" y="151" width="524" height="22" rx="3" fill="#16a34a"/><text x="722" y="167" class="value">18.60</text>

  <text x="175" y="302" text-anchor="end" class="label">Creative writing</text>
  <rect x="190" y="234" width="463" height="22" rx="3" fill="#57606a"/><text x="661" y="250" class="value">16.43</text>
  <rect x="190" y="262" width="235" height="22" rx="3" fill="#d97706"/><text x="433" y="278" class="value">8.35</text>
  <rect x="190" y="290" width="273" height="22" rx="3" fill="#2563eb"/><text x="471" y="306" class="value">9.70</text>
  <rect x="190" y="318" width="307" height="22" rx="3" fill="#16a34a"/><text x="505" y="334" class="value">10.91</text>

  <text x="190" y="428" text-anchor="middle" class="tick">0</text>
  <text x="331" y="428" text-anchor="middle" class="tick">5</text>
  <text x="472" y="428" text-anchor="middle" class="tick">10</text>
  <text x="613" y="428" text-anchor="middle" class="tick">15</text>
  <text x="754" y="428" text-anchor="middle" class="tick">20 tok/s</text>

  <rect x="165" y="458" width="14" height="10" rx="2" fill="#57606a"/><text x="187" y="467" class="tick">Target only</text>
  <rect x="302" y="458" width="14" height="10" rx="2" fill="#d97706"/><text x="324" y="467" class="tick">Fixed 4</text>
  <rect x="410" y="458" width="14" height="10" rx="2" fill="#2563eb"/><text x="432" y="467" class="tick">Acceptance rate</text>
  <rect x="576" y="458" width="14" height="10" rx="2" fill="#16a34a"/><text x="598" y="467" class="tick">Accepted length</text>
</svg>
