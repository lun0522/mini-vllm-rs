<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="445" viewBox="0 0 1250 445" role="img" aria-labelledby="title desc">
<title id="title">Routing decisions for one saturated 48-request run</title>
<desc id="desc">Requests 1 through 48 appear in arrival order across three rows. Blue cells selected the Metal GPU and orange cells selected the CPU. Darker cells indicate a larger relative difference between the two estimated completion-time scores. Requests 7, 24, 29, 34, and 40 selected CPU, with increasingly small absolute score margins shown inside each cell.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}.title{font-size:22px;font-weight:600}.subtitle,.note{font-size:14px;fill:#57606a}.row{font-size:14px;font-weight:600}.number{font-size:15px;font-weight:700}.margin{font-size:11px}.legend{font-size:13px;fill:#57606a}</style>
<defs>
