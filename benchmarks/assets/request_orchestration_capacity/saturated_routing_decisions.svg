<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="445" viewBox="0 0 1250 445" role="img" aria-labelledby="title desc">
<title id="title">Routing decisions for one saturated 48-request run</title>
<desc id="desc">Requests 1 through 48 appear in arrival order across three rows. Blue cells selected the Metal GPU and orange cells selected the CPU. Darker cells indicate a larger relative difference between the two estimated completion-time scores. Requests 8, 16, 23, 31, 39, and 46 selected CPU, with absolute score margins shown inside each cell.</desc>
