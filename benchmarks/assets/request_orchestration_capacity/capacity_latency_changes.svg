<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="705" viewBox="0 0 1200 705" role="img" aria-labelledby="title desc">
<title id="title">Mixed-routing changes relative to forced-GPU execution</title>
<desc id="desc">A diverging horizontal bar chart compares wall time, output throughput, median time to first token, and p95 time to first token for GPU-only, crossover, and saturated workloads. Error whiskers show sample standard deviation across three paired runs.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}.title{font-size:22px;font-weight:600}.subtitle,.tick,.note{font-size:14px;fill:#57606a}.group{font-size:16px;font-weight:600}.metric{font-size:13px;fill:#57606a}.value{font-size:12px;fill:#24292f}.grid{stroke:#d8dee4;stroke-width:1}.zero{stroke:#24292f;stroke-width:1.5}</style>
<rect width="1200" height="705" fill="white"/>
<text x="600" y="32" text-anchor="middle" class="title">Mixed routing changes capacity and latency differently</text>
<text x="600" y="57" text-anchor="middle" class="subtitle">Change relative to forced GPU · mean ± sample standard deviation across 3 paired runs</text>
<line x1="320" y1="100" x2="320" y2="638" class="grid"/><text x="320" y="665" text-anchor="middle" class="tick">-30%</text>
<line x1="430" y1="100" x2="430" y2="638" class="grid"/><text x="430" y="665" text-anchor="middle" class="tick">-20%</text>
<line x1="540" y1="100" x2="540" y2="638" class="grid"/><text x="540" y="665" text-anchor="middle" class="tick">-10%</text>
<line x1="650" y1="100" x2="650" y2="638" class="zero"/><text x="650" y="665" text-anchor="middle" class="tick">0%</text>
<line x1="760" y1="100" x2="760" y2="638" class="grid"/><text x="760" y="665" text-anchor="middle" class="tick">+10%</text>
<line x1="870" y1="100" x2="870" y2="638" class="grid"/><text x="870" y="665" text-anchor="middle" class="tick">+20%</text>
<line x1="980" y1="100" x2="980" y2="638" class="grid"/><text x="980" y="665" text-anchor="middle" class="tick">+30%</text>
<text x="72" y="125" class="group">GPU only · 4 requests</text>
<text x="235" y="155" text-anchor="end" class="metric">Wall time</text><rect x="650.0" y="141" width="1.1" height="18" rx="2" fill="#2563eb" fill-opacity=".85"/><line x1="639.0" y1="150" x2="663.2" y2="150" stroke="#24292f" stroke-width="1.5"/><line x1="639.0" y1="145" x2="639.0" y2="155" stroke="#24292f" stroke-width="1.5"/><line x1="663.2" y1="145" x2="663.2" y2="155" stroke="#24292f" stroke-width="1.5"/><text x="671.2" y="155" text-anchor="start" class="value">+0.1% ± 1.1%</text>
<text x="235" y="185" text-anchor="end" class="metric">Output throughput</text><rect x="648.9" y="171" width="1.1" height="18" rx="2" fill="#16a34a" fill-opacity=".85"/><line x1="636.8" y1="180" x2="661.0" y2="180" stroke="#24292f" stroke-width="1.5"/><line x1="636.8" y1="175" x2="636.8" y2="185" stroke="#24292f" stroke-width="1.5"/><line x1="661.0" y1="175" x2="661.0" y2="185" stroke="#24292f" stroke-width="1.5"/><text x="628.8" y="185" text-anchor="end" class="value">-0.1% ± 1.1%</text>
<text x="235" y="215" text-anchor="end" class="metric">Median TTFT</text><rect x="569.7" y="201" width="80.3" height="18" rx="2" fill="#d97706" fill-opacity=".85"/><line x1="481.7" y1="210" x2="657.7" y2="210" stroke="#24292f" stroke-width="1.5"/><line x1="481.7" y1="205" x2="481.7" y2="215" stroke="#24292f" stroke-width="1.5"/><line x1="657.7" y1="205" x2="657.7" y2="215" stroke="#24292f" stroke-width="1.5"/><text x="473.7" y="215" text-anchor="end" class="value">-7.3% ± 8.0%</text>
<text x="235" y="245" text-anchor="end" class="metric">p95 TTFT</text><rect x="492.7" y="231" width="157.3" height="18" rx="2" fill="#7c3aed" fill-opacity=".85"/><line x1="399.2" y1="240" x2="586.2" y2="240" stroke="#24292f" stroke-width="1.5"/><line x1="399.2" y1="235" x2="399.2" y2="245" stroke="#24292f" stroke-width="1.5"/><line x1="586.2" y1="235" x2="586.2" y2="245" stroke="#24292f" stroke-width="1.5"/><text x="391.2" y="245" text-anchor="end" class="value">-14.3% ± 8.5%</text>
<text x="72" y="299" class="group">Crossover · 7 requests</text>
<text x="235" y="329" text-anchor="end" class="metric">Wall time</text><rect x="522.4" y="315" width="127.6" height="18" rx="2" fill="#2563eb" fill-opacity=".85"/><line x1="509.2" y1="324" x2="535.6" y2="324" stroke="#24292f" stroke-width="1.5"/><line x1="509.2" y1="319" x2="509.2" y2="329" stroke="#24292f" stroke-width="1.5"/><line x1="535.6" y1="319" x2="535.6" y2="329" stroke="#24292f" stroke-width="1.5"/><text x="501.2" y="329" text-anchor="end" class="value">-11.6% ± 1.2%</text>
<text x="235" y="359" text-anchor="end" class="metric">Output throughput</text><rect x="650.0" y="345" width="144.1" height="18" rx="2" fill="#16a34a" fill-opacity=".85"/><line x1="777.6" y1="354" x2="810.6" y2="354" stroke="#24292f" stroke-width="1.5"/><line x1="777.6" y1="349" x2="777.6" y2="359" stroke="#24292f" stroke-width="1.5"/><line x1="810.6" y1="349" x2="810.6" y2="359" stroke="#24292f" stroke-width="1.5"/><text x="818.6" y="359" text-anchor="start" class="value">+13.1% ± 1.5%</text>
<text x="235" y="389" text-anchor="end" class="metric">Median TTFT</text><rect x="650.0" y="375" width="93.5" height="18" rx="2" fill="#d97706" fill-opacity=".85"/><line x1="498.2" y1="384" x2="988.8" y2="384" stroke="#24292f" stroke-width="1.5"/><line x1="498.2" y1="379" x2="498.2" y2="389" stroke="#24292f" stroke-width="1.5"/><line x1="988.8" y1="379" x2="988.8" y2="389" stroke="#24292f" stroke-width="1.5"/><text x="996.8" y="389" text-anchor="start" class="value">+8.5% ± 22.3%</text>
<text x="235" y="419" text-anchor="end" class="metric">p95 TTFT</text><rect x="650.0" y="405" width="41.8" height="18" rx="2" fill="#7c3aed" fill-opacity=".85"/><line x1="689.6" y1="414" x2="694.0" y2="414" stroke="#24292f" stroke-width="1.5"/><line x1="689.6" y1="409" x2="689.6" y2="419" stroke="#24292f" stroke-width="1.5"/><line x1="694.0" y1="409" x2="694.0" y2="419" stroke="#24292f" stroke-width="1.5"/><text x="702.0" y="419" text-anchor="start" class="value">+3.8% ± 0.2%</text>
<text x="72" y="473" class="group">Saturated · 48 requests</text>
<text x="235" y="503" text-anchor="end" class="metric">Wall time</text><rect x="543.3" y="489" width="106.7" height="18" rx="2" fill="#2563eb" fill-opacity=".85"/><line x1="536.7" y1="498" x2="549.9" y2="498" stroke="#24292f" stroke-width="1.5"/><line x1="536.7" y1="493" x2="536.7" y2="503" stroke="#24292f" stroke-width="1.5"/><line x1="549.9" y1="493" x2="549.9" y2="503" stroke="#24292f" stroke-width="1.5"/><text x="528.7" y="503" text-anchor="end" class="value">-9.7% ± 0.6%</text>
<text x="235" y="533" text-anchor="end" class="metric">Output throughput</text><rect x="650.0" y="519" width="117.7" height="18" rx="2" fill="#16a34a" fill-opacity=".85"/><line x1="760.0" y1="528" x2="775.4" y2="528" stroke="#24292f" stroke-width="1.5"/><line x1="760.0" y1="523" x2="760.0" y2="533" stroke="#24292f" stroke-width="1.5"/><line x1="775.4" y1="523" x2="775.4" y2="533" stroke="#24292f" stroke-width="1.5"/><text x="783.4" y="533" text-anchor="start" class="value">+10.7% ± 0.7%</text>
<text x="235" y="563" text-anchor="end" class="metric">Median TTFT</text><rect x="377.2" y="549" width="272.8" height="18" rx="2" fill="#d97706" fill-opacity=".85"/><line x1="370.6" y1="558" x2="383.8" y2="558" stroke="#24292f" stroke-width="1.5"/><line x1="370.6" y1="553" x2="370.6" y2="563" stroke="#24292f" stroke-width="1.5"/><line x1="383.8" y1="553" x2="383.8" y2="563" stroke="#24292f" stroke-width="1.5"/><text x="362.6" y="563" text-anchor="end" class="value">-24.8% ± 0.6%</text>
<text x="235" y="593" text-anchor="end" class="metric">p95 TTFT</text><rect x="526.8" y="579" width="123.2" height="18" rx="2" fill="#7c3aed" fill-opacity=".85"/><line x1="477.3" y1="588" x2="576.3" y2="588" stroke="#24292f" stroke-width="1.5"/><line x1="477.3" y1="583" x2="477.3" y2="593" stroke="#24292f" stroke-width="1.5"/><line x1="576.3" y1="583" x2="576.3" y2="593" stroke="#24292f" stroke-width="1.5"/><text x="469.3" y="593" text-anchor="end" class="value">-11.2% ± 4.5%</text>
<text x="650" y="695" text-anchor="middle" class="note">← decrease · increase →   Lower is better for time metrics; higher is better for output throughput.</text>
</svg>

