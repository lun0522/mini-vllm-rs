<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title description">
  <title id="title">Head-of-line follower time to first token by request and scheduling policy</title>
  <desc id="description">For the oldest long follower, all three policies have similar time to first token. For the short follower, shortest prefill first is fastest, round robin is second, and FCFS is slowest.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .title { font-size: 18px; font-weight: 600; }
    .subtitle { font-size: 12px; fill: #57606a; }
    .group { font-size: 14px; font-weight: 600; }
    .tick { font-size: 12px; fill: #57606a; }
    .value { font-size: 12px; font-weight: 600; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
  </style>

  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="27" text-anchor="middle" class="title">Head-of-line follower TTFT</text>
  <text x="450" y="46" text-anchor="middle" class="subtitle">Lower is better; mean of 3 runs</text>

  <!-- Plot: x=240..780 maps 0..10 seconds. -->
  <line x1="240" y1="65" x2="240" y2="340" class="grid"/>
  <line x1="348" y1="65" x2="348" y2="340" class="grid"/>
  <line x1="456" y1="65" x2="456" y2="340" class="grid"/>
  <line x1="564" y1="65" x2="564" y2="340" class="grid"/>
  <line x1="672" y1="65" x2="672" y2="340" class="grid"/>
  <line x1="780" y1="65" x2="780" y2="340" class="grid"/>
  <line x1="240" y1="340" x2="800" y2="340" class="grid"/>

  <text x="220" y="128" text-anchor="end" class="group">Oldest long follower</text>
  <rect x="240" y="82" width="504" height="22" rx="3" fill="#2563eb"/>
  <rect x="240" y="112" width="531" height="22" rx="3" fill="#16a34a"/>
  <rect x="240" y="142" width="531" height="22" rx="3" fill="#f59e0b"/>
  <text x="734" y="98" text-anchor="end" class="value" fill="#ffffff">9.331 s</text>
  <text x="761" y="128" text-anchor="end" class="value" fill="#ffffff">9.835 s</text>
  <text x="761" y="158" text-anchor="end" class="value" fill="#ffffff">9.826 s</text>

  <text x="220" y="258" text-anchor="end" class="group">Short follower</text>
  <rect x="240" y="212" width="502" height="22" rx="3" fill="#2563eb"/>
  <rect x="240" y="242" width="73" height="22" rx="3" fill="#16a34a"/>
  <rect x="240" y="272" width="123" height="22" rx="3" fill="#f59e0b"/>
  <text x="732" y="228" text-anchor="end" class="value" fill="#ffffff">9.289 s</text>
  <text x="321" y="258" class="value">1.343 s</text>
  <text x="371" y="288" class="value">2.277 s</text>

  <text x="240" y="361" text-anchor="middle" class="tick">0</text>
  <text x="348" y="361" text-anchor="middle" class="tick">2</text>
  <text x="456" y="361" text-anchor="middle" class="tick">4</text>
  <text x="564" y="361" text-anchor="middle" class="tick">6</text>
  <text x="672" y="361" text-anchor="middle" class="tick">8</text>
  <text x="780" y="361" text-anchor="middle" class="tick">10 s</text>

  <rect x="315" y="391" width="14" height="10" rx="2" fill="#2563eb"/>
  <text x="337" y="400" class="tick">FCFS</text>
  <rect x="423" y="391" width="14" height="10" rx="2" fill="#16a34a"/>
  <text x="445" y="400" class="tick">SPF</text>
  <rect x="525" y="391" width="14" height="10" rx="2" fill="#f59e0b"/>
  <text x="547" y="400" class="tick">RR</text>
</svg>
