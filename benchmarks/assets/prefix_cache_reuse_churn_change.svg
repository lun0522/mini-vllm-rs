<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Churn prefill and TTFT reduction with prefix caching</title>
  <desc id="desc">Zero-centered dot chart showing that prefill and time-to-first-token reductions in both churn cycles were approximately zero percent. Error bars show one sample standard deviation across three runs.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .title { font-size: 18px; font-weight: 600; }
    .subtitle { font-size: 12px; fill: #57606a; }
    .axis { font-size: 13px; fill: #57606a; }
    .tick { font-size: 12px; fill: #57606a; }
    .value { font-size: 12px; font-weight: 600; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .zero { stroke: #57606a; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .error { stroke-width: 2; }
  </style>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" class="title">Churn Latency Reduction with Prefix Caching</text>
  <text x="450" y="48" text-anchor="middle" class="subtitle">Mean ± sample standard deviation across 3 runs</text>

  <line x1="110" y1="70" x2="830" y2="70" class="grid"/>
  <line x1="110" y1="130" x2="830" y2="130" class="grid"/>
  <line x1="110" y1="190" x2="830" y2="190" class="zero"/>
  <line x1="110" y1="250" x2="830" y2="250" class="grid"/>
  <line x1="110" y1="310" x2="830" y2="310" class="grid"/>
  <text x="98" y="74" text-anchor="end" class="tick">0.5%</text>
  <text x="98" y="134" text-anchor="end" class="tick">0.25%</text>
  <text x="98" y="194" text-anchor="end" class="tick">0%</text>
  <text x="98" y="254" text-anchor="end" class="tick">−0.25%</text>
  <text x="98" y="314" text-anchor="end" class="tick">−0.5%</text>
  <text x="28" y="190" text-anchor="middle" class="axis" transform="rotate(-90 28 190)">Reduction vs baseline</text>

  <text x="315" y="338" text-anchor="middle" class="axis">Cycle 1</text>
  <text x="615" y="338" text-anchor="middle" class="axis">Cycle 2</text>

  <line x1="280" y1="142" x2="280" y2="238" class="error" stroke="#d97706"/>
  <line x1="272" y1="142" x2="288" y2="142" class="error" stroke="#d97706"/>
  <line x1="272" y1="238" x2="288" y2="238" class="error" stroke="#d97706"/>
  <circle cx="280" cy="190" r="6" fill="#d97706"/>
  <text x="280" y="260" text-anchor="middle" class="value">0.0% ± 0.2%</text>

  <line x1="350" y1="142" x2="350" y2="190" class="error" stroke="#2563eb"/>
  <line x1="342" y1="142" x2="358" y2="142" class="error" stroke="#2563eb"/>
  <line x1="342" y1="190" x2="358" y2="190" class="error" stroke="#2563eb"/>
  <circle cx="350" cy="166" r="6" fill="#2563eb"/>
  <text x="350" y="124" text-anchor="middle" class="value">0.1% ± 0.1%</text>

  <circle cx="580" cy="190" r="6" fill="#d97706"/>
  <text x="580" y="214" text-anchor="middle" class="value">0.0% ± 0.0%</text>
  <circle cx="650" cy="190" r="6" fill="#2563eb"/>
  <text x="650" y="174" text-anchor="middle" class="value">0.0% ± 0.0%</text>

  <circle cx="342" cy="390" r="6" fill="#d97706"/><text x="356" y="394" class="tick">Prefill</text>
  <circle cx="452" cy="390" r="6" fill="#2563eb"/><text x="466" y="394" class="tick">TTFT</text>
</svg>
