<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Time to first token by input token length</title>
  <desc id="desc">Line chart comparing ordinary paged-cache and prefix-cached time to first token for inputs from 98 to 904 tokens, with prefix overlap increasing from zero to 100 percent.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .title { font-size: 18px; font-weight: 600; }
    .axis { font-size: 13px; fill: #57606a; }
    .tick { font-size: 12px; fill: #57606a; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .series { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  </style>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" class="title">TTFT by Input Token Length</text>

  <line x1="90" y1="330" x2="830" y2="330" class="grid"/>
  <line x1="90" y1="272" x2="830" y2="272" class="grid"/>
  <line x1="90" y1="214" x2="830" y2="214" class="grid"/>
  <line x1="90" y1="156" x2="830" y2="156" class="grid"/>
  <line x1="90" y1="99" x2="830" y2="99" class="grid"/>
  <text x="78" y="334" text-anchor="end" class="tick">0</text>
  <text x="78" y="276" text-anchor="end" class="tick">300</text>
  <text x="78" y="218" text-anchor="end" class="tick">600</text>
  <text x="78" y="160" text-anchor="end" class="tick">900</text>
  <text x="78" y="103" text-anchor="end" class="tick">1,200</text>

  <line x1="90" y1="330" x2="830" y2="330" stroke="#57606a"/>
  <line x1="90" y1="60" x2="90" y2="330" stroke="#57606a"/>
  <text x="163" y="350" text-anchor="middle" class="tick">98</text><text x="163" y="365" text-anchor="middle" class="tick">(0%)</text>
  <text x="268" y="350" text-anchor="middle" class="tick">241</text><text x="268" y="365" text-anchor="middle" class="tick">(25%)</text>
  <text x="430" y="350" text-anchor="middle" class="tick">459</text><text x="430" y="365" text-anchor="middle" class="tick">(50%)</text>
  <text x="594" y="350" text-anchor="middle" class="tick">681</text><text x="594" y="365" text-anchor="middle" class="tick">(75%)</text>
  <text x="759" y="350" text-anchor="middle" class="tick">904</text><text x="759" y="365" text-anchor="middle" class="tick">(100%)</text>
  <text x="460" y="386" text-anchor="middle" class="axis">Input tokens (prefix overlap)</text>
  <text x="24" y="195" text-anchor="middle" class="axis" transform="rotate(-90 24 195)">TTFT (ms)</text>

  <polyline points="163,315 268,292 430,239 594,169 759,74" class="series" stroke="#d97706"/>
  <polyline points="163,315 268,321 430,322 594,321 759,320" class="series" stroke="#2563eb"/>
  <g fill="#d97706"><circle cx="163" cy="315" r="4"/><circle cx="268" cy="292" r="4"/><circle cx="430" cy="239" r="4"/><circle cx="594" cy="169" r="4"/><circle cx="759" cy="74" r="4"/></g>
  <g fill="#2563eb"><circle cx="163" cy="315" r="4"/><circle cx="268" cy="321" r="4"/><circle cx="430" cy="322" r="4"/><circle cx="594" cy="321" r="4"/><circle cx="759" cy="320" r="4"/></g>

  <line x1="303" y1="405" x2="327" y2="405" class="series" stroke="#d97706"/><circle cx="315" cy="405" r="4" fill="#d97706"/>
  <text x="335" y="409" class="tick">Baseline</text>
  <line x1="455" y1="405" x2="479" y2="405" class="series" stroke="#2563eb"/><circle cx="467" cy="405" r="4" fill="#2563eb"/>
  <text x="487" y="409" class="tick">Prefix cached</text>
</svg>
