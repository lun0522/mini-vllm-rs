<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Long-output mean TTFT with independent and completion-gated execution</title>
  <desc id="desc">Line chart comparing mean time to first token for independent execution and exact-input single flight until request completion at concurrency two, four, and eight with 128-token outputs.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .title { font-size: 18px; font-weight: 600; }
    .subtitle { font-size: 12px; fill: #57606a; }
    .axis { font-size: 13px; fill: #57606a; }
    .tick { font-size: 12px; fill: #57606a; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .series { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  </style>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" class="title">Long-Output Mean TTFT</text>
  <text x="450" y="48" text-anchor="middle" class="subtitle">Simultaneous identical bursts with 128-token output</text>

  <line x1="90" y1="330" x2="830" y2="330" class="grid"/>
  <line x1="90" y1="263" x2="830" y2="263" class="grid"/>
  <line x1="90" y1="195" x2="830" y2="195" class="grid"/>
  <line x1="90" y1="128" x2="830" y2="128" class="grid"/>
  <line x1="90" y1="60" x2="830" y2="60" class="grid"/>
  <text x="78" y="334" text-anchor="end" class="tick">0</text>
  <text x="78" y="267" text-anchor="end" class="tick">1,000</text>
  <text x="78" y="199" text-anchor="end" class="tick">2,000</text>
  <text x="78" y="132" text-anchor="end" class="tick">3,000</text>
  <text x="78" y="64" text-anchor="end" class="tick">4,000</text>

  <line x1="90" y1="330" x2="830" y2="330" stroke="#57606a"/>
  <line x1="90" y1="60" x2="90" y2="330" stroke="#57606a"/>
  <text x="150" y="352" text-anchor="middle" class="tick">2</text>
  <text x="460" y="352" text-anchor="middle" class="tick">4</text>
  <text x="770" y="352" text-anchor="middle" class="tick">8</text>
  <text x="460" y="380" text-anchor="middle" class="axis">Concurrent requests</text>
  <text x="24" y="195" text-anchor="middle" class="axis" transform="rotate(-90 24 195)">Mean TTFT (ms)</text>

  <polyline points="150,259 460,204 770,75" class="series" stroke="#d97706"/>
  <polyline points="150,238 460,211 770,196" class="series" stroke="#2563eb"/>
  <g fill="#d97706"><circle cx="150" cy="259" r="5"/><circle cx="460" cy="204" r="5"/><circle cx="770" cy="75" r="5"/></g>
  <g fill="#2563eb"><circle cx="150" cy="238" r="5"/><circle cx="460" cy="211" r="5"/><circle cx="770" cy="196" r="5"/></g>

  <line x1="274" y1="405" x2="298" y2="405" class="series" stroke="#d97706"/><circle cx="286" cy="405" r="4" fill="#d97706"/>
  <text x="306" y="409" class="tick">Independent</text>
  <line x1="436" y1="405" x2="460" y2="405" class="series" stroke="#2563eb"/><circle cx="448" cy="405" r="4" fill="#2563eb"/>
  <text x="468" y="409" class="tick">Single flight until completion</text>
</svg>
