<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title description">
  <title id="title">Target-only and fixed-4 decode throughput</title>
  <desc id="description">Fixed-4 is slower than target-only for both code refactoring and creative writing, with a much larger regression for creative writing.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .title { font-size: 18px; font-weight: 600; }
    .label { font-size: 14px; }
    .tick { font-size: 12px; fill: #57606a; }
    .value { font-size: 12px; font-weight: 600; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
  </style>

  <rect width="900" height="350" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" class="title">Decode throughput: fixed-4 vs. target only</text>

  <!-- Plot: x=190..810 maps 0..20 tok/s. -->
  <line x1="190" y1="55" x2="190" y2="278" class="grid"/>
  <line x1="345" y1="55" x2="345" y2="278" class="grid"/>
  <line x1="500" y1="55" x2="500" y2="278" class="grid"/>
  <line x1="655" y1="55" x2="655" y2="278" class="grid"/>
  <line x1="810" y1="55" x2="810" y2="278" class="grid"/>

  <text x="175" y="101" text-anchor="end" class="label">Code refactoring</text>
  <rect x="190" y="72" width="553" height="24" rx="3" fill="#57606a"/>
  <text x="751" y="89" class="value">17.84</text>
  <rect x="190" y="104" width="484" height="24" rx="3" fill="#d97706"/>
  <text x="682" y="121" class="value">15.61</text>

  <text x="175" y="206" text-anchor="end" class="label">Creative writing</text>
  <rect x="190" y="177" width="557" height="24" rx="3" fill="#57606a"/>
  <text x="755" y="194" class="value">17.96</text>
  <rect x="190" y="209" width="264" height="24" rx="3" fill="#d97706"/>
  <text x="462" y="226" class="value">8.50</text>

  <text x="190" y="298" text-anchor="middle" class="tick">0</text>
  <text x="345" y="298" text-anchor="middle" class="tick">5</text>
  <text x="500" y="298" text-anchor="middle" class="tick">10</text>
  <text x="655" y="298" text-anchor="middle" class="tick">15</text>
  <text x="810" y="298" text-anchor="middle" class="tick">20 tok/s</text>

  <rect x="318" y="321" width="14" height="10" rx="2" fill="#57606a"/>
  <text x="340" y="330" class="tick">Target only</text>
  <rect x="474" y="321" width="14" height="10" rx="2" fill="#d97706"/>
  <text x="496" y="330" class="tick">Fixed 4</text>
</svg>
