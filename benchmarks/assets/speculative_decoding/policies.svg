<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title description">
  <title id="title">Decode throughput by speculative policy</title>
  <desc id="description">Both dynamic policies outperform fixed-4 for code refactoring and creative writing. They exceed target-only throughput for code but not creative writing.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .title { font-size: 18px; font-weight: 600; }
    .label { font-size: 14px; }
    .tick { font-size: 12px; fill: #57606a; }
    .value { font-size: 12px; font-weight: 600; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
  </style>

  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" class="title">Decode throughput by policy</text>

  <!-- Plot: x=190..810 maps 0..25 tok/s. -->
  <line x1="190" y1="55" x2="190" y2="407" class="grid"/>
  <line x1="314" y1="55" x2="314" y2="407" class="grid"/>
  <line x1="438" y1="55" x2="438" y2="407" class="grid"/>
  <line x1="562" y1="55" x2="562" y2="407" class="grid"/>
  <line x1="686" y1="55" x2="686" y2="407" class="grid"/>
  <line x1="810" y1="55" x2="810" y2="407" class="grid"/>

  <text x="175" y="135" text-anchor="end" class="label">Code refactoring</text>
  <rect x="190" y="67" width="442" height="22" rx="3" fill="#57606a"/>
  <text x="640" y="83" class="value">17.84</text>
  <rect x="190" y="95" width="387" height="22" rx="3" fill="#d97706"/>
  <text x="585" y="111" class="value">15.61</text>
  <rect x="190" y="123" width="612" height="22" rx="3" fill="#2563eb"/>
  <text x="810" y="139" class="value">24.68</text>
  <rect x="190" y="151" width="554" height="22" rx="3" fill="#16a34a"/>
  <text x="752" y="167" class="value">22.33</text>

  <text x="175" y="302" text-anchor="end" class="label">Creative writing</text>
  <rect x="190" y="234" width="445" height="22" rx="3" fill="#57606a"/>
  <text x="643" y="250" class="value">17.96</text>
  <rect x="190" y="262" width="211" height="22" rx="3" fill="#d97706"/>
  <text x="409" y="278" class="value">8.50</text>
  <rect x="190" y="290" width="282" height="22" rx="3" fill="#2563eb"/>
  <text x="480" y="306" class="value">11.36</text>
  <rect x="190" y="318" width="300" height="22" rx="3" fill="#16a34a"/>
  <text x="498" y="334" class="value">12.12</text>

  <text x="190" y="428" text-anchor="middle" class="tick">0</text>
  <text x="314" y="428" text-anchor="middle" class="tick">5</text>
  <text x="438" y="428" text-anchor="middle" class="tick">10</text>
  <text x="562" y="428" text-anchor="middle" class="tick">15</text>
  <text x="686" y="428" text-anchor="middle" class="tick">20</text>
  <text x="810" y="428" text-anchor="middle" class="tick">25 tok/s</text>

  <rect x="165" y="458" width="14" height="10" rx="2" fill="#57606a"/>
  <text x="187" y="467" class="tick">Target only</text>
  <rect x="302" y="458" width="14" height="10" rx="2" fill="#d97706"/>
  <text x="324" y="467" class="tick">Fixed 4</text>
  <rect x="410" y="458" width="14" height="10" rx="2" fill="#2563eb"/>
  <text x="432" y="467" class="tick">Acceptance rate</text>
  <rect x="576" y="458" width="14" height="10" rx="2" fill="#16a34a"/>
  <text x="598" y="467" class="tick">Accepted length</text>
</svg>
