[package]
name = "mini-vllm-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A small Candle-based LLM inference project"
license = "MIT"

[features]
default = []
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "dep:cudarc",
]

[dependencies]
anyhow = "1.0"
argh = "0.1"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
cfg-if = "1.0"
cudarc = { version = "0.19.8", default-features = false, features = ["nvtx"], optional = true }
env_logger = "0.11"
hf-hub = "0.4.1"
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
log = "0.4"
prost = "0.13"
prost-reflect = { version = "0.14.7", features = ["text-format"] }
rand = "0.9"
tempfile = "3.0"
thousands = "0.2.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokenizers = { version = "0.22.0", default-features = false, features = ["onig"] }
tonic = "0.12"
tower = { version = "0.4", features = ["util"] }
tracing = "0.1"
tracing-chrome = "0.7.2"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
lto = "thin"
