syntax = "proto3";

package inference_config;

// Identifies a GGUF model and the tokenizer used with it on Hugging Face.
message ModelConfig {
  // Hugging Face repository containing the GGUF file.
  string model_id = 1;
  // GGUF filename within the model repository.
  string model_filename = 2;
  // Hugging Face repository providing tokenizer.json.
  string tokenizer_id = 3;
  // Model repository branch, tag, or commit hash; defaults to main when empty.
  string model_revision = 4;
}

// Configures the model and token-count policy used for speculative decoding.
message DraftModelConfig {
  // Hugging Face model and tokenizer used to produce draft tokens.
  ModelConfig model = 1;
  // Policy controlling the number of tokens proposed per decode step.
  DraftTokenCountPolicy token_count_policy = 2;
}

// Configures a model-runner process with an already downloaded draft model.
message DraftModelRunnerConfig {
  // Local path to the draft model's GGUF file.
  string model_path = 1;
  // Policy controlling the number of tokens proposed per decode step.
  DraftTokenCountPolicy token_count_policy = 2;
}

// Selects how many tokens the draft model proposes per speculative decode step.
message DraftTokenCountPolicy {
  oneof policy {
    // Uses a constant proposal length.
    FixedDraftTokenCountPolicy fixed = 1;
    // Adjusts the proposal length based on the draft-token acceptance rate.
    AcceptanceRateDraftTokenCountPolicy acceptance_rate = 2;
    // Selects the proposal length from a smoothed history of accepted lengths.
    AcceptedLengthDraftTokenCountPolicy accepted_length = 3;
  }
}

// Uses the same draft proposal length throughout a request.
message FixedDraftTokenCountPolicy {
  // Number of tokens proposed by the draft model per speculative decode step.
  uint64 draft_token_count = 1;
}

// draft_token_count starts at initial_draft_token_count.
// acceptance_rate = accepted_token_count / proposed_token_count
// if acceptance_rate < decrease_threshold: draft_token_count -= 1
// if acceptance_rate > increase_threshold: draft_token_count += 1
// draft_token_count = clamp(draft_token_count, minimum_draft_token_count,
//                           maximum_draft_token_count)
message AcceptanceRateDraftTokenCountPolicy {
  // Proposal length used when a generation request starts.
  uint64 initial_draft_token_count = 1;
  // Acceptance rates below this value reduce the proposal length by one.
  float decrease_threshold = 2;
  // Acceptance rates above this value increase the proposal length by one.
  float increase_threshold = 3;
  // Smallest proposal length allowed by the policy.
  uint64 minimum_draft_token_count = 4;
  // Largest proposal length allowed by the policy.
  uint64 maximum_draft_token_count = 5;
}

// draft_token_count starts at initial_draft_token_count, and smoothed_length starts
// at initial_draft_token_count - 1.
// smoothed_length = smoothing_factor * accepted_token_count
//                   + (1 - smoothing_factor) * previous_smoothed_length
// draft_token_count = clamp(round(smoothed_length) + 1, minimum_draft_token_count,
//                           maximum_draft_token_count)
// The extra token tests whether the draft can extend beyond its recently accepted prefix.
message AcceptedLengthDraftTokenCountPolicy {
  // Proposal length used when a generation request starts.
  uint64 initial_draft_token_count = 1;
  // Weight assigned to the newest accepted length; must be greater than zero and at most one.
  float smoothing_factor = 2;
  // Smallest proposal length allowed by the policy.
  uint64 minimum_draft_token_count = 3;
  // Largest proposal length allowed by the policy.
  uint64 maximum_draft_token_count = 4;
}

// Configures request admission and model-batch construction.
message SchedulerConfig {
  // Maximum number of tokens processed in one model batch.
  uint32 max_batched_token_count = 1;
  // Maximum number of requests that may hold active inference state.
  uint32 max_active_request_count = 2;
  // Policy used to choose requests for the next model batch.
  SchedulingPolicy scheduling_policy = 3;
}

// Selects the order in which requests are admitted and prefills are scheduled.
enum SchedulingPolicy {
  SCHEDULING_POLICY_FIRST_COME_FIRST_SERVED = 0;
  SCHEDULING_POLICY_SHORTEST_PREFILL_FIRST = 1;
  SCHEDULING_POLICY_ROUND_ROBIN = 2;
}
