syntax = "proto3";

package request_handler;

import "model_runner.proto";

service RequestHandlerService {
  // Streams a text-generation request through the model runner process.
  rpc GenerateText(model_runner.GenerateText) returns (stream model_runner.GenerateTextEvent);
  // Gracefully stops the request handler process.
  rpc Shutdown(model_runner.Shutdown) returns (model_runner.CommandResult);
}
