syntax = "proto3";

package request_handler;

import "model_runner.proto";

service RequestHandlerService {
  // Streams a text-generation request through the model runner process.
  rpc GenerateText(.request_handler.GenerateText) returns (stream .request_handler.GenerateTextEvent);
  // Gracefully stops the request handler process.
  rpc Shutdown(.request_handler.Shutdown) returns (.request_handler.CommandResult);
}

message GenerateText {
  // Identifier assigned by the request handler before preprocessing.
  uint64 request_id = 1;
  // User text inserted into the model's chat template.
  string prompt = 2;
  // Maximum number of tokens the model may generate before stopping.
  uint64 max_new_tokens = 3;
  // Positive finite penalty applied to previously seen tokens; 1.0 disables it.
  float repeat_penalty = 4;
  // Number of recent tokens considered when applying the repetition penalty.
  uint64 repeat_last_n = 5;
  // Whether text events contain incremental fragments or one buffered response.
  bool stream_output = 6;
  // Benchmarking only: ignore end-of-sequence tokens and generate until max_new_tokens is reached.
  bool ignore_eos_tokens = 7;
}

message GenerateTextEvent {
  // The next item produced by text generation.
  oneof event {
    // A decoded fragment, or the complete response when streaming is disabled.
    string text = 1;
    // Generation statistics; always the final event on successful completion.
    model_runner.TextGenerationStats stats = 2;
  }
}

// Requests a graceful shutdown of the request-handler process.
message Shutdown {}

// Indicates that a request-handler command completed successfully.
message CommandResult {}
