syntax = "proto3";

package model_runner;

service ModelRunnerService {
  // Generates text and returns output events followed by final statistics.
  rpc GenerateText(.model_runner.GenerateText) returns (stream GenerateTextEvent);
  // Executes a command in the model runner process.
  rpc HandleCommand(ModelRunnerCommand) returns (CommandResult);
}

// Local files required to load a downloaded GGUF model.
message ModelPaths {
  // Local tokenizer.json path.
  string tokenizer_path = 1;
  // Local GGUF model path.
  string gguf_path = 2;
}

message ModelRunnerCommand {
  // The operation for the model runner to execute.
  oneof command {
    // Gracefully stops the model runner process.
    Shutdown shutdown = 1;
  }
}

message GenerateText {
  // User text inserted into the model's chat template.
  string prompt = 1;
  // Maximum number of tokens the model may generate before stopping.
  uint64 max_new_tokens = 2;
  // Penalty applied to previously seen tokens; 1.0 disables it.
  float repeat_penalty = 3;
  // Number of recent tokens considered when applying the repetition penalty.
  uint64 repeat_last_n = 4;
  // Whether text events contain incremental fragments or one buffered response.
  bool stream_output = 5;
}

message GenerateTextEvent {
  // The next item produced by text generation.
  oneof event {
    // A decoded fragment, or the complete response when streaming is disabled.
    string text = 1;
    // Generation statistics; always the final event on successful completion.
    TextGenerationStats stats = 2;
  }
}

message TextGenerationStats {
  // Number of tokens in the encoded, formatted input prompt.
  uint64 input_token_count = 1;
  // Number of generated tokens, excluding the terminal end-of-sequence token.
  uint64 output_token_count = 2;
  // Prefill time in milliseconds.
  uint64 prefill_duration_milliseconds = 3;
  // Decode time in milliseconds.
  uint64 decode_duration_milliseconds = 4;
}

// Requests a graceful shutdown of the model runner process.
message Shutdown {}

// Indicates that a model runner command completed successfully.
message CommandResult {}
