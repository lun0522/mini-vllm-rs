syntax = "proto3";

package model_runner;

service ModelRunnerService {
  // Returns metadata required for tokenizer validation and input processing.
  rpc GetModelMetadata(GetModelMetadataRequest) returns (GetModelMetadataResponse);
  // Returns a snapshot of prefix-cache telemetry for each inference backend.
  rpc GetPrefixCacheTelemetry(GetPrefixCacheTelemetryRequest) returns (GetPrefixCacheTelemetryResponse);
  // Generates text and returns output events followed by final statistics.
  rpc GenerateText(GenerateTextRequest) returns (stream GenerateTextEvent);
  // Executes a command in the model runner process.
  rpc HandleCommand(ModelRunnerCommand) returns (CommandResult);
}

enum ModelArchitecture {
  MODEL_ARCHITECTURE_UNSPECIFIED = 0;
  MODEL_ARCHITECTURE_LLAMA = 1;
  MODEL_ARCHITECTURE_QWEN2 = 2;
}

message GetModelMetadataRequest {}

message ModelMetadata {
  // Model family used to select the architecture-specific implementation.
  ModelArchitecture architecture = 1;
  // Number of rows in the input token-embedding tensor. This is the range of token IDs the model
  // can accept and may include padding rows that are not defined by the tokenizer.
  uint64 input_vocabulary_size = 2;
  // Number of logits produced by the model's output projection. This may differ from the input
  // tensor size and may include padding logits that do not correspond to tokenizer tokens.
  uint64 output_vocabulary_size = 3;
  // Number of usable token IDs defined by the tokenizer embedded in the GGUF model. Trailing tokens
  // marked unused and extra model tensor rows are excluded from tokenization and sampling.
  uint64 tokenizer_vocabulary_size = 4;
  // Maximum sequence length supported by the model.
  uint64 context_length = 5;
}

message GetModelMetadataResponse {
  ModelMetadata target_model = 1;
  optional ModelMetadata draft_model = 2;
}

message GetPrefixCacheTelemetryRequest {}

message GetPrefixCacheTelemetryResponse {
  // Per-backend snapshots, ordered by backend ID.
  repeated InferenceBackendPrefixCacheTelemetry backends = 1;
}

message InferenceBackendPrefixCacheTelemetry {
  // Process-local identifier of the inference backend that owns these caches.
  uint64 backend_id = 1;
  // Target-model prefix-cache telemetry; absent when prefix caching is disabled.
  optional PrefixCacheTelemetry target = 2;
  // Draft-model prefix-cache telemetry; absent when no draft model is configured or prefix
  // caching is disabled.
  optional PrefixCacheTelemetry draft = 3;
}

message PrefixCacheTelemetry {
  // Maximum number of sequence tokens that the KV cache can hold.
  uint64 token_capacity = 1;
  // Number of tokens currently indexed and available for prefix reuse.
  uint64 current_indexed_token_count = 2;
  // Number of tokens newly indexed since the inference backend started.
  uint64 cumulative_indexed_token_count = 3;
  // Number of indexed tokens evicted since the inference backend started.
  uint64 cumulative_evicted_token_count = 4;
  // Number of tokens restored into requests since the inference backend started.
  uint64 cumulative_restored_token_count = 5;
  // Number of prefix-cache lookups since the inference backend started.
  uint64 cumulative_lookup_count = 6;
  // Number of lookups that restored at least one token since the inference backend started.
  uint64 cumulative_hit_count = 7;
}

message ModelRunnerCommand {
  // The operation for the model runner to execute.
  oneof command {
    // Gracefully stops the model runner process.
    Shutdown shutdown = 1;
  }
}

message GenerateTextRequest {
  // Request-handler-assigned identifier used to correlate request lifecycle logs.
  uint64 request_id = 1;
  // Fully formatted and tokenized input prompt.
  repeated uint32 input_token_ids = 2;
  // Maximum number of tokens the model may generate before stopping.
  uint64 max_new_tokens = 3;
  // Sampling temperature over the tokenizer vocabulary; zero selects greedy decoding.
  float temperature = 4;
  // Maximum total variation distance [0.0, 1.0] allowed from the target distribution during
  // stochastic speculative verification; zero requires exact target-distribution matching.
  float total_variation_budget = 5;
  // Random sampling seed; omitted selects a random seed. Zero is a valid seed.
  optional uint64 seed = 6;
  // Positive finite penalty applied to previously seen tokens; 1.0 disables it.
  float repeat_penalty = 7;
  // Number of recent tokens considered when applying the repetition penalty.
  uint64 repeat_last_n = 8;
  // Token IDs that terminate generation without being emitted.
  repeated uint32 end_of_sequence_token_ids = 9;
  // Benchmarking only: one-based backend ID to use instead of orchestrator selection; zero lets
  // the orchestrator select the backend normally.
  uint64 benchmark_backend_id = 10;
}

message GenerateTextEvent {
  oneof event {
    // A generated token ID.
    uint32 token_id = 1;
    // Generation statistics; always the final event on successful completion.
    TextGenerationStats stats = 2;
  }
}

message TextGenerationStats {
  // Request-handler-assigned identifier, matching the request ID in server logs.
  uint64 request_id = 1;
  // One-based process-local identifier of the inference backend that served the request.
  uint64 backend_id = 2;
  // Observable reason that successful generation finished.
  TextGenerationFinishReason finish_reason = 3;
  // Number of tokens in the encoded, formatted input prompt.
  uint64 input_token_count = 4;
  // Number of generated tokens, excluding the terminal end-of-sequence token.
  uint64 output_token_count = 5;
  // Request latency and model-execution phase durations.
  GenerationTiming timing = 6;
  // Speculative-decoding statistics; absent when no draft model is configured.
  DraftTokenStats draft_token_stats = 7;
  // Prefix-cache statistics for the target model.
  PrefixCacheStats target_prefix_cache_stats = 8;
  // Prefix-cache statistics for the draft model; absent when no draft model is configured.
  PrefixCacheStats draft_prefix_cache_stats = 9;
}

message PrefixCacheStats {
  // Number of input-prefix tokens restored from this model's prefix cache.
  uint64 restored_token_count = 1;
  // Number of previously uncached tokens this request added to the prefix cache.
  uint64 newly_indexed_token_count = 2;
}

enum TextGenerationFinishReason {
  TEXT_GENERATION_FINISH_REASON_UNSPECIFIED = 0;
  END_OF_SEQUENCE_TOKEN = 1;
  MAX_NEW_TOKENS_REACHED = 2;
}

message DraftTokenStats {
  // Total number of draft tokens accepted by the target model.
  uint64 accepted_token_count = 1;
  // Total number of draft tokens proposed, including a final capped proposal.
  uint64 proposed_token_count = 2;
  // Number of verifications using each policy-selected draft-token count.
  repeated DraftTokenCountHistogramBucket selected_token_count_histogram = 3;
}

message DraftTokenCountHistogramBucket {
  // Draft-token count selected by the policy before any output-limit cap.
  uint64 draft_token_count = 1;
  // Number of verifications for which the policy selected this count.
  uint64 usage_count = 2;
}

message GenerationTiming {
  // Time from model-runner queue arrival until the first output token; zero when none was emitted.
  uint64 time_to_first_token_microseconds = 1;
  // Time from model-runner queue arrival until the final output token; zero when none was emitted.
  uint64 time_to_last_token_microseconds = 2;
  // Time spent executing prefill model work, excluding queueing.
  uint64 prefill_duration_microseconds = 3;
  // Time spent executing decode model work, excluding queueing.
  uint64 decode_duration_microseconds = 4;
  // Time from model-runner queue arrival until request finalization completed.
  uint64 request_completion_latency_microseconds = 5;
}

// Requests a graceful shutdown of the model runner process.
message Shutdown {}

// Indicates that a model runner command completed successfully.
message CommandResult {}
